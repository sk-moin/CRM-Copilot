version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_copilot
    ports:
      - "5433:5432"
    # No explicit init script – the migration will CREATE EXTENSION pgcrypto and vector
    # Volumes are optional for persistence; omitted for this dev session.

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      # Host 6380: another Redis already occupies 6379 on at least one dev
      # machine. Set REDIS_URL=redis://localhost:6380 to use this one.
      - "6380:6379"
    # Refresh tokens and rate-limit counters only; nothing here is durable, so
    # no volume. A local stub package used to stand in for this service, which
    # is why it was missing from compose entirely.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

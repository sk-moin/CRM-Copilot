name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The suite talks to a real database and a real Redis; it does not fake
      # either. pgvector is required because the schema declares a vector
      # column, and 5433 matches the port hardcoded in tests/conftest.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_copilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Deterministic in-process provider. The suite must never reach a paid
      # third-party API: it costs money and makes a red run ambiguous between a
      # code defect and someone else's outage.
      LLM_PROVIDER: mock
      # Defaults to huggingface, which downloads sentence-transformers.
      # tests/conftest.py also pins this; set here so the intent is visible
      # in the job and so anything running outside that conftest agrees.
      EMBEDDING_PROVIDER: mock
      REDIS_URL: redis://localhost:6379
      # tests/integration/test_real_worker.py drives a real arq worker and
      # SKIPS when it cannot reach Redis. It defaults to the compose port
      # 6380, which does not exist here, so without this the five tests
      # covering arq's real control flow would quietly not run -- and they
      # are the only coverage of the retry, timeout and stranding behaviour.
      TEST_REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the suite has actually been verified on.
          # The project plan says 3.12; nothing has been run against it.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Roughly 2 GB, dominated by torch. langchain_core imports
        # transformers at module scope, so torch comes along regardless of
        # what this project does. The pip cache above keeps it to cold runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify
        # The exact command documented in AGENTS.md. Keep the two in step.
        run: alembic upgrade head && python -m pytest
